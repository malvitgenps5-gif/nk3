<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЖК Дмитриевский</title>	 
    <style>
        @font-face {
            font-family: 'LeviBrush';
            src: url('/.github.io/fonts/LEVIBRUSH.woff2') format('woff2'); 
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #viewport {
            width: 1080px;
            height: 1920px;
            background-color: #000;
            overflow: hidden;
            position: relative;
            transform-origin: center center;
            flex-shrink: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .header {
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 10px;
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.85);
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            color: #ff2222;
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 10;
            box-sizing: border-box;
            border-bottom: 2px solid #500;
        }
    </style>
</head>
<body>

<div id="viewport">
    <div class="header">
        Консьерж НК3 <span id="current-month"></span>
    </div>
    <div id="grid"></div>
    <canvas id="matrix" width="1080" height="1920"></canvas>
</div>

<script>
// Вывод текущего месяца (срабатывает сразу при загрузке скрипта)
const currentMonthEl = document.getElementById('current-month');
if (currentMonthEl) {
    const nowTime = new Date();
    const month = String(nowTime.getMonth() + 1).padStart(2, '0');
    const year = nowTime.getFullYear();
    currentMonthEl.innerText = `${month}/${year}`;
}

const viewport = document.getElementById('viewport');
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

// --- ВАШИ ОБНОВЛЕННЫЕ ПАРАМЕТРЫ ---
const fontSize = 180;
const speedInterval = 15;
const maxActiveNumbers = 10;
let activeNumbers = [];
let redRoomIds = [];

// --- ГЕНЕРАЦИЯ СЕТКИ ДЛЯ ИСКЛЮЧЕНИЯ ПЕРЕКРЫТИЯ ---
const gridCols = Math.floor(canvas.width / (fontSize * 1.4)) || 1;
const gridRows = Math.floor((canvas.height - 180) / (fontSize * 1.4)) || 1;
const cellWidth = canvas.width / gridCols;
const cellHeight = (canvas.height - 180) / gridRows;

// Массив всех доступных ячеек сетки
let gridCells = [];
for (let c = 0; c < gridCols; c++) {
    for (let r = 0; r < gridRows; r++) {
        gridCells.push({ col: c, row: r });
    }
}

// Глобальная функция, которую вызывает главная страница для обновления фрейма
window.updateFrameData = function(pageData) {
    console.log('Фрейм получил команду на обновление данных локально.');

    // Читаем свежий CSV прямо из LocalStorage, куда его сохраняет главная страница
    const csv = localStorage.getItem('sheet_data');
    if (!csv) {
        console.warn('Кэш sheet_data пуст.');
        return;
    }

    // Разбиваем по строкам, убирая пустые
    const rows = csv.split(/\r?\n/).filter(row => row.trim() !== "");
    if (rows.length === 0) return;

    // Парсим заголовки из первой строки (rows)
    const headers = rows[0].split(",").map(h => h.trim().toLowerCase());
    const idIdx = headers.indexOf("id");
    const currentIdx = headers.indexOf("current");

    const currentRedList = [];
    rows.slice(1).forEach(rowStr => {
        const row = rowStr.split(",");
        const id = parseInt(row[idIdx]?.trim());
        const current = row[currentIdx]?.trim() || "0";
        
        // Фильтруем только красные квартиры (ID от 1 до 192, у которых current === "0")
        if (!isNaN(id) && id >= 1 && id <= 192 && current === "0") {
            currentRedList.push(id);
        }
    });

    redRoomIds = currentRedList;
    console.log('Данные успешно пересчитаны. Красных квартир:', redRoomIds.length);
};

// --- КЛАСС ЦИФРЫ С УЧЕТОМ ЗАНЯТОЙ ЯЧЕЙКИ ---
class PaintNumber {
    constructor(id, cellIndex, cell) {
        this.id = id;
        this.cellIndex = cellIndex;
        this.x = cell.col * cellWidth + (cellWidth / 2);
        this.y = 180 + (cell.row * cellHeight) + (cellHeight / 2);
        this.alpha = 0;
        this.state = 'fade-in';
        this.fadeSpeed = Math.random() * 0.015 + 0.01;
        this.visibleTime = Math.random() * 80 + 60;
    }

    update() {
        if (this.state === 'fade-in') {
            this.alpha += this.fadeSpeed;
            if (this.alpha >= 1) {
                this.alpha = 1;
                this.state = 'visible';
            }
        } else if (this.state === 'visible') {
            this.visibleTime--;
            if (this.visibleTime <= 0) {
                this.state = 'fade-out';
            }
        } else if (this.state === 'fade-out') {
            this.alpha -= this.fadeSpeed;
            if (this.alpha <= 0) {
                this.alpha = 0;
                this.state = 'dead';
            }
        }
    }

    draw() {
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = '#e60000';
        ctx.shadowColor = '#800000';
        ctx.shadowBlur = 15;
        ctx.fillText(this.id, this.x, this.y);
    }
}

// Основной цикл анимации canvas
function drawLoop() {
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px "LeviBrush", Impact, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';

    // 1. Собираем индексы занятых ячеек и блокируем их соседей по горизонтали
    const blockedCellIndices = new Set();
    activeNumbers.forEach(num => {
        blockedCellIndices.add(num.cellIndex);
        const currentCell = gridCells[num.cellIndex];
        if (currentCell) {
            const leftNeighborIndex = gridCells.findIndex(c => c.row === currentCell.row && c.col === currentCell.col - 1);
            if (leftNeighborIndex !== -1) blockedCellIndices.add(leftNeighborIndex);

            const rightNeighborIndex = gridCells.findIndex(c => c.row === currentCell.row && c.col === currentCell.col + 1);
            if (rightNeighborIndex !== -1) blockedCellIndices.add(rightNeighborIndex);
        }
    });

    // 2. Фильтруем полностью свободные ячейки с учетом горизонтального соседства
    const freeCellIndices = gridCells
        .map((_, index) => index)
        .filter(index => !blockedCellIndices.has(index));

    // Добавляем новые цифры
    if (redRoomIds.length > 0 && activeNumbers.length < maxActiveNumbers && freeCellIndices.length > 0 && Math.random() > 0.7) {
        const randomId = redRoomIds[Math.floor(Math.random() * redRoomIds.length)];
        const isAlreadyVisible = activeNumbers.some(num => num.id === randomId);
        
        if (!isAlreadyVisible) {
            const randomCellIndex = freeCellIndices[Math.floor(Math.random() * freeCellIndices.length)];
            const targetCell = gridCells[randomCellIndex];
            activeNumbers.push(new PaintNumber(randomId, randomCellIndex, targetCell));
        }
    }

    // Обновляем и отрисовываем активные элементы
    activeNumbers.forEach(num => {
        num.update();
        num.draw();
    });

    // Удаляем завершившие анимацию цифры
    activeNumbers = activeNumbers.filter(num => num.state !== 'dead');
}

// Первичный запуск при старте
function initializeApp() {
    window.updateFrameData();
    setInterval(drawLoop, speedInterval);
}

// Безопасная инициализация после загрузки шрифтов (важно для правильного рендера шрифта LeviBrush на Canvas)
if (document.fonts) {
    document.fonts.ready.then(function() {
        console.log('Шрифты загружены. Запуск анимации матрицы.');
        initializeApp();
    });
} else {
    window.onload = function() {
        setTimeout(initializeApp, 1000);
    };
}
</script>
</body>
</html>
