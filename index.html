<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ЖК Дмитриевский</title>
  <link rel="icon" href="data:,">	
  <! Предзагрузка локального шрифта для кеширования -->
  <link rel="preload" href="/nk3/fonts/LEVIBRUSH.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/nk3/fonts/Comfortaa.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/nk3/fonts/Roboto.woff2" as="font" type="font/woff2" crossorigin>
	
<style> 
  @font-face { 
    font-family: 'LeviBrush'; 
    src: url('../fonts/LEVIBRUSH.woff2') format('woff2'); 
    font-weight: normal; 
    font-style: normal; 
    font-display: swap; 
  }

  @font-face {
    font-family: 'Comfortaa';
    src: url('../fonts/Comfortaa.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
  }
	@font-face {
	  font-family: 'Roboto';
	  src: url('../fonts/Roboto.woff2') format('woff2');
	}
  /* Обнуляем отступы на самом верхнем уровне */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000; /* Черные поля по бокам, если экран слишком широкий */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ИСПРАВЛЕНО: Главный контейнер теперь жестко держит пропорции 1080x1920 */
  .frame-container {
    position: relative;
    width: 1080px;
    height: 1920px;
    transform-origin: center center;
    flex-shrink: 0;
  }

  /* Фреймы просто занимают 100% от нашего откалиброванного контейнера */
  .my-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .my-frame.active {
    opacity: 1;
    pointer-events: auto;
  }
#countdown-timer {
    position: fixed !important; /* !important гарантирует приоритет */
    bottom: 15px !important;
    right: 15px !important;
    z-index: 999999 !important; /* Максимальный приоритет поверх любых фреймов */
    
    /* Внешний вид */
    /* background-color: rgba(0, 0, 0, 0.6) !important; /* Чуть темнее для контраста */
    color: rgba(255, 255, 255, 0.2) !important; 
    padding: 6px 12px !important;
    border-radius: 5px !important;
    font-family: monospace !important;
    font-size: 16px !important; /* Немного увеличили размер для видимости */
    
    /* Игнорирование мыши и фокусов */
    pointer-events: none !important; 
    user-select: none !important;
}
</style>
</head>
<body>
<div id="countdown-timer">05:00</div>
  <div id="container" class="frame-container">
    <!-- Фреймы создаются автоматически скриптом -->
  </div>

<script>
// !!! ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ НА CSV ИЗ GOOGLE ТАБЛИЦ !!!
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQQJOCD4_INUxusWkaSaPbGhGBh5tMVAylQrQ4zYLK7DYunMhYkxOpC9mm4phbM3xKqmo073qzGgntE/pub?gid=469920882&single=true&output=csv'; 
const CACHE_KEY = 'sheet_data';
const TIMESTAMP_KEY = 'sheet_timestamp';
const REFRESH_INTERVAL = 300000; // 5 минут (300 000 мс)

let pages = [];
let current = 0;
let timerId = null; // Для управления таймаутом слайдов
let timeLeft = REFRESH_INTERVAL; // Для визуального таймера

// 1. Получение данных (Исправлена логика TTL - теперь запрашивает сеть строго вовремя)
async function getSharedData(forceNetwork = false) {
    const cached = localStorage.getItem(CACHE_KEY);
    const lastUpdate = parseInt(localStorage.getItem(TIMESTAMP_KEY), 10);
    const now = Date.now();

    // Забираем из кеша только если не прошёл интервал И если это не плановое обновление
    if (!forceNetwork && cached && lastUpdate && (now - lastUpdate < REFRESH_INTERVAL - 2000)) {
        // 2026.07.14 закоментили лог console.log('Данные CSV взяты из LocalStorage');
        return cached;
    }

    try {
        // 2026.07.14 закоментили лог console.log('Сетевой запрос за новым CSV...');
        // Добавляем timestamp к URL, чтобы сам браузер не кешировал ответ Google
        const response = await fetch(`${CSV_URL}${CSV_URL.includes('?') ? '&' : '?'}t=${now}`);
        const data = await response.text();
        
        if (!data || data.trim() === "") throw new Error("Получена пустая строка");

        localStorage.setItem(CACHE_KEY, data);
        localStorage.setItem(TIMESTAMP_KEY, now.toString());
        return data;
    } catch (err) {
        // 2026.07.14 закоментили лог console.error('Ошибка загрузки CSV, взят старый кеш:', err);
        return cached;
    }
}

// 2. Парсинг полученной CSV строки
function parseCSV(csv) {
    if (!csv) return [];
    const rows = csv.split("\n").map(r => r.split(","));
    const headers = rows[0].map(h => h.trim());
    const urlIdx = headers.indexOf("url");
    const durationIdx = headers.indexOf("duration");

    if (urlIdx === -1) {
        // 2026.07.14 закоментили лог console.error("Ошибка: В CSV не найден столбец 'url'");
        return [];
    }

    return rows.slice(1)
        .map(row => ({
            url: row[urlIdx]?.trim() || "",
            duration: parseInt(row[durationIdx]?.trim(), 10) || 30000
        }))
        .filter(page => page.url !== "" && !isNaN(page.duration));
}

// 3. Создание только уникальных фреймов в DOM (Добавлен data-base-src для безопасного сброса кеша)
function createAllFrames() {
    const container = document.getElementById("container");
    if (!container) return;
    container.innerHTML = ""; 

    const uniqueUrls = [...new Set(pages.map(page => page.url))];
    uniqueUrls.forEach((url) => {
        const iframe = document.createElement("iframe");
        iframe.id = `frame_${btoa(url).replace(/=/g, '')}`;
        
        const fullSrc = "frame/" + url;
        iframe.src = fullSrc;
        iframe.setAttribute('data-base-src', fullSrc); // Сохраняем чистый путь для reloadAllFrames
        iframe.className = "my-frame";
        iframe.tabIndex = "-1";
        container.appendChild(iframe);
    });
    // 2026.07.14 закоментили лог console.log(`Массив шагов: ${pages.length}. Создано уникальных фреймов в DOM: ${uniqueUrls.length}`);
}

// 4. Показ следующего слайда (Исправлена потенциальная ошибка с undefined)
function showNext() {
    if (pages.length === 0) return;

    // Скрываем старый активный фрейм
    const activeFrame = document.querySelector(".my-frame.active");
    if (activeFrame) {
        activeFrame.classList.remove("active");
        activeFrame.tabIndex = "-1";
    }

    // Защита от выхода за пределы массива при динамическом изменении страниц
    if (current >= pages.length) current = 0;

    const currentPage = pages[current];
    const frameId = `frame_${btoa(currentPage.url).replace(/=/g, '')}`;
    const nextFrame = document.getElementById(frameId);

    if (nextFrame) {
        nextFrame.classList.add("active");
        nextFrame.tabIndex = "0";

        // Передаем данные внутрь фрейма, если он готов
        if (nextFrame.contentWindow && typeof nextFrame.contentWindow.updateFrameData === 'function') {
            // 2026.07.14 закоментили лог console.log(`Передаем новые данные во фрейм: ${currentPage.url}`);
            nextFrame.contentWindow.updateFrameData(currentPage);
        }
    } else {
        // 2026.07.14 закоментили лог console.error(`Фрейм для URL ${currentPage.url} не найден в DOM`);
    }

    current = (current + 1) % pages.length;
    
    // Перезапускаем таймаут
    clearTimeout(timerId);
    timerId = setTimeout(showNext, currentPage.duration);
}

// 5. Принудительное обновление содержимого фреймов (Исправлено чтение путей через data-атрибут)
function reloadAllFrames() {
    // 2026.07.14 закоментили лог console.log("Принудительное обновление контента страниц внутри фреймов (Раз в час)...");
    const frames = document.querySelectorAll(".my-frame");
    frames.forEach(iframe => {
        const baseSrc = iframe.getAttribute('data-base-src') || iframe.src.split('?')[0];
        iframe.src = baseSrc + "?v=" + Date.now();
    });
}

// 6. Фоновое обновление списка страниц (Добавлен сброс таймера слайдов при изменениях)
async function refreshPagesList() {
    const csv = await getSharedData(true); // Передаем true, заставляя сделать реальный сетевой запрос
    if (!csv) return;
    
    const newPages = parseCSV(csv);
    if (newPages.length > 0) {
        const oldUrls = pages.map(p => p.url).join(',');
        const newUrls = newPages.map(p => p.url).join(',');
        
        pages = newPages;
        // 2026.07.14 закоментили лог console.log('Список шагов обновлен в фоне. Всего:', pages.length);

        if (oldUrls !== newUrls) {
            // 2026.07.14 закоментили лог console.log('Состав страниц изменился, полностью перестраиваем фреймы и перезапускаем слайдер...');
            clearTimeout(timerId); // Останавливаем старый цикл слайдов, чтобы не было наложения
            current = 0;
            createAllFrames();
            showNext(); // Запуск с первой страницы обновленного списка
        }
    }
}

// 7. СИНХРОНИЗИРОВАННЫЙ ТАЙМЕР (Единый секундный тик для интерфейса и логики)
function updateTimerDisplay() {
    const minutes = Math.floor(timeLeft / 60000);
    const seconds = Math.floor((timeLeft % 60000) / 1000);
    
    const displayMinutes = String(minutes).padStart(2, '0');
    const displaySeconds = String(seconds).padStart(2, '0');
    
    const timerElement = document.getElementById('countdown-timer');
    if (timerElement) {
        timerElement.textContent = `${displayMinutes}:${displaySeconds}`;
    }
}

setInterval(() => {
    timeLeft -= 1000;
    
    if (timeLeft <= 0) {
        timeLeft = REFRESH_INTERVAL; // Сбрасываем счетчик обратно на 5 минут
        refreshPagesList();          // Вызываем обновление данных СТРОГО в момент 00:00 на экране
    }
    
    updateTimerDisplay();
}, 1000);

// 8. ВТОРОЙ НЕЗАВИСИМЫЙ ТАЙМЕР (Перезагрузка файлов из сети раз в 1 час)
setInterval(reloadAllFrames, 3600000);

// 9. Автоматическое сжатие слайдера под размеры окна
function resizeMainViewport() {
    const container = document.getElementById("container");
    if (!container) return;
    const targetWidth = 1080;
    const targetHeight = 1920;
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    const scale = Math.min(windowWidth / targetWidth, windowHeight / targetHeight);
    container.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', resizeMainViewport);
setTimeout(resizeMainViewport, 100);

// СТАРТ ПРИЛОЖЕНИЯ ПРИ ПЕРВОЙ ЗАГРУЗКЕ
getSharedData(false).then(csv => {
    if (!csv) return;
    pages = parseCSV(csv);
    if (pages.length > 0) {
        createAllFrames();
        showNext();
    }
    updateTimerDisplay(); // Сразу рисуем 05:00
});

</script>
</body>
</html>
